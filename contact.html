<link rel="stylesheet" href="styles.css">
<style>
.contact-cards { display:flex; flex-direction:column; gap:1rem; max-width:480px; margin:0 auto; }
.contact-card {
  background:var(--card-bg); border:1px solid var(--border); border-radius:14px;
  padding:1.1rem 1.4rem; display:flex; align-items:center; gap:1rem;
  text-decoration:none; transition:all 0.3s;
}
.contact-card:hover { border-color:rgba(0,212,255,0.35); box-shadow:var(--glow); transform:translateX(4px); }
.contact-card-icon {
  width:44px; height:44px; border-radius:12px;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.icon-linkedin { background:rgba(10,102,194,0.15); border:1px solid rgba(10,102,194,0.3); }
.icon-email    { background:rgba(0,212,255,0.1);   border:1px solid rgba(0,212,255,0.25); }
.icon-github   { background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12); }
.icon-location { background:rgba(123,47,255,0.1);  border:1px solid rgba(123,47,255,0.25); }
.contact-card-label { font-size:0.68rem; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.12em; margin-bottom:0.15rem; }
.contact-card-value { font-size:0.88rem; color:var(--text); font-weight:500; }
</style>
</head>
